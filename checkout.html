
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تأیید درخواست | Solver</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { font-family: 'Vazirmatn', sans-serif; background: #f7f8fc; color: #20243a; }
    .navbar { background: #fff; border-bottom: 1px solid #eee; }
    .brand { color: #6658e8; font-size: 1.6rem; font-weight: 800; text-decoration: none; }
    .page-wrap { max-width: 850px; margin: 45px auto; padding: 0 16px; }
    .panel { background: #fff; border: 1px solid #ececf4; border-radius: 20px; padding: 28px; box-shadow: 0 8px 30px #20243a08; }
    .muted { color: #777d91; }
    .btn-solver { background: #6658e8; color: #fff; border: 0; border-radius: 10px; padding: 12px 20px; font-weight: 700; }
    .btn-solver:hover { background: #5143d0; color: #fff; }
    .form-control, .form-select { padding: 12px; border-radius: 10px; }
    .notice { background: #f0eeff; border-radius: 12px; padding: 14px; color: #5143b7; }
    footer { text-align: center; color: #777d91; padding: 25px 12px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container py-2">
      <a class="brand" href="index.html">Solver</a>
      <a href="services.html" class="btn btn-outline-secondary">مشاهده پروژه‌ها</a>
    </div>
  </nav>

  <main class="page-wrap">
    <div class="mb-4">
      <h1 class="h3 fw-bold">تأیید و ارسال درخواست</h1>
      <p class="muted">اطلاعاتت رو بررسی کن و درخواستت رو ثبت کن.</p>
    </div>

    <div class="panel">
      <div class="notice mb-4">
        این مرحله نمایشی است؛ در حال حاضر پرداخت واقعی یا تراکنش بانکی انجام نمی‌شود.
      </div>

      <div id="projectSummary" class="mb-4">
        <h2 class="h5 fw-bold">خلاصه درخواست</h2>
        <p class="muted mb-0">در حال بررسی اطلاعات...</p>
      </div>

      <form id="checkoutForm">
        <h2 class="h5 fw-bold mb-3">اطلاعات تماس</h2>

        <div class="mb-3">
          <label for="fullName" class="form-label">نام و نام خانوادگی</label>
          <input type="text" id="fullName" class="form-control" required maxlength="80" placeholder="نام شما">
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">ایمیل</label>
          <input type="email" id="email" class="form-control" required maxlength="120" placeholder="example@email.com">
        </div>

        <div class="mb-4">
          <label for="notes" class="form-label">توضیحات تکمیلی (اختیاری)</label>
          <textarea id="notes" class="form-control" rows="3" maxlength="1000" placeholder="اگر نکته‌ای هست بنویس..."></textarea>
        </div>

        <div id="formMessage" class="mb-3" role="status"></div>

        <button type="submit" class="btn btn-solver w-100">ثبت درخواست نمایشی</button>
        <a href="services.html" class="btn btn-light w-100 mt-2">بازگشت به فهرست پروژه‌ها</a>
      </form>
    </div>
  </main>

  <footer>Solver — مهارتت، راه‌حل توئه.</footer>

  <script>
    const summary = document.getElementById('projectSummary');
    const form = document.getElementById('checkoutForm');
    const message = document.getElementById('formMessage');

    const params = new URLSearchParams(window.location.search);
    const projectId = params.get('id');
    const projectTitle = params.get('title');

    let selectedProject = null;

    try {
      const projects = JSON.parse(localStorage.getItem('solverProjects') || '[]');
      selectedProject = projects.find(p => String(p.id) === String(projectId)) || null;
    } catch (error) {
      console.error('Could not read saved projects:', error);
    }

    if (selectedProject) {
      summary.innerHTML = `
        <h2 class="h5 fw-bold">خلاصه پروژه</h2>
        <p class="mb-1"><strong>عنوان:</strong> ${escapeHTML(selectedProject.title || 'بدون عنوان')}</p>
        <p class="mb-1"><strong>بودجه پیشنهادی:</strong> ${escapeHTML(String(selectedProject.budget || 'تعیین نشده'))}</p>
        <p class="mb-0"><strong>مهلت:</strong> ${escapeHTML(selectedProject.deadline || 'تعیین نشده')}</p>
      `;
    } else if (projectTitle) {
      summary.innerHTML = `
        <h2 class="h5 fw-bold">خلاصه درخواست</h2>
        <p class="mb-0"><strong>عنوان:</strong> ${escapeHTML(projectTitle)}</p>
        <p class="small muted mt-2 mb-0">جزئیات کامل این پروژه در اطلاعات ذخیره‌شده پیدا نشد.</p>
      `;
    } else {
      summary.innerHTML = `
        <h2 class="h5 fw-bold">خلاصه درخواست</h2>
        <p class="muted mb-0">پروژه مشخصی انتخاب نشده است. می‌توانی از فهرست پروژه‌ها وارد جزئیات یک پروژه شوی.</p>
      `;
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    form.addEventListener('submit', function(event) {
      event.preventDefault();

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const notes = document.getElementById('notes').value.trim();

      if (!fullName || !email) {
        message.className = 'text-danger mb-3';
        message.textContent = 'لطفاً نام و ایمیل را وارد کن.';
        return;
      }

      const request = {
        id: Date.now(),
        projectId: projectId || null,
        projectTitle: selectedProject?.title || projectTitle || 'درخواست بدون پروژه مشخص',
        fullName,
        email,
        notes,
        createdAt: new Date().toISOString(),
        status: 'demo'
      };

      try {
        const requests = JSON.parse(localStorage.getItem('solverRequests') || '[]');
        requests.push(request);
        localStorage.setItem('solverRequests', JSON.stringify(requests));
        localStorage.setItem('solverLastRequest', JSON.stringify(request));
        window.location.href = 'payment-success.html';
      } catch (error) {
        message.className = 'text-danger mb-3';
        message.textContent = 'ذخیره درخواست انجام نشد. فضای ذخیره‌سازی مرورگر را بررسی کن.';
      }
    });
  </script>
</body>
</html>
